[package]
name = "mik32_hello_world"
version = "0.1.0"
edition = "2024"

[dependencies]

# Базовый рантайн для bare-metal RISC-V (инициализация памяти, таблица векторов)
# riscv = "0.16.1"
# ВКЛЮЧАЕМ РЕАЛИЗАЦИЮ КРИТИЧЕСКОЙ СЕКЦИИ:
# Флаг 'critical-section-single-hart' заставит библиотеку riscv предоставить функцию _critical_section_1_0_acquire
riscv = { version = "=0.16.1", features = ["critical-section-single-hart"] }
riscv-rt = "=0.18.0"
# Добавляем реализацию критической секции через глобальное отключение прерываний RISC-V
# critical-section = "1.1.3"
# riscv-critical-section = "0.1.0"

# Обработчик паники (вызывает бесконечный цикл при panic!)
panic-halt = "=1.0.0"

# PAC (Peripheral Access Crate) для MIK32 Амур
# mik32v2-pac = "0.0.2"
mik32-pac = "=1.8.2"

[profile.release]
opt-level = "s"     # Оптимизация по размеру бинарного кода
lto = true          # Link-Time Optimization для удаления мертвого кода
codegen-units = 1   # Максимальная оптимизация


